name: Feature request
description: Propose a focused TIDAL workflow or MCP improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the real workflow rather than only an upstream method name.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
    validations:
      required: true
  - type: dropdown
    id: behavior
    attributes:
      label: External behavior
      options:
        - Read-only
        - Non-destructive write
        - Destructive write
        - No external interaction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Upstream evidence
      description: Link the relevant tidalapi or official TIDAL documentation when available.
