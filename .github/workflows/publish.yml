name: Publish npm and MCP Registry release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.1.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish verified release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sickn33/tidal-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve the release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag was provided."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked npm dependencies
        run: npm ci

      - name: Verify the GitHub tag and synchronized versions
        run: npm run check:release -- "${{ steps.release.outputs.tag }}"

      - name: Verify package contents and metadata
        run: npm pack --dry-run

      - name: Publish to npm with Trusted Publishing
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if curl --fail --silent --output /dev/null \
            "https://registry.npmjs.org/@sickn33%2Ftidal-mcp/${VERSION}"; then
            echo "@sickn33/tidal-mcp@${VERSION} is already published; skipping."
          else
            npm publish
          fi

      - name: Wait for the npm version to be publicly visible
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null \
              "https://registry.npmjs.org/@sickn33%2Ftidal-mcp/${VERSION}"; then
              echo "@sickn33/tidal-mcp@${VERSION} is visible on npm."
              exit 0
            fi
            echo "Waiting for @sickn33/tidal-mcp@${VERSION} (attempt ${attempt}/30)"
            sleep 20
          done
          echo "::error::@sickn33/tidal-mcp@${VERSION} never became visible on npm."
          exit 1

      - name: Install the pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          MCP_PUBLISHER_VERSION: 1.8.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to the MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the official MCP Registry
        run: |
          for attempt in $(seq 1 5); do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "MCP Registry publish attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          echo "::error::The MCP Registry did not accept the release after 5 attempts."
          exit 1
